<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chenabcall - Professional Portal</title>
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>
    <style>
        * { box-sizing: border-box; font-family: Arial, sans-serif; margin: 0; padding: 0; }
        body { background-color: #e5ddd5; display: flex; justify-content: center; align-items: center; height: 100vh; }
        
        #auth-section { background: white; padding: 30px; border-radius: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); width: 340px; text-align: center; }
        #auth-section input, #auth-section select { width: 100%; padding: 10px; margin: 8px 0; border: 1px solid #ccc; border-radius: 5px; outline: none; }
        #auth-section button { width: 100%; padding: 10px; margin-top: 5px; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; }
        .btn-login { background-color: #075e54; color: white; }
        .btn-reg { background-color: #128c7e; color: white; }

        #app-section { display: none; width: 95%; max-width: 1100px; height: 90vh; background: white; border-radius: 10px; box-shadow: 0 4px 15px rgba(0,0,0,0.2); overflow: hidden; }
        
        .sidebar { width: 35%; background: #f0f2f5; border-right: 1px solid #ddd; display: flex; flex-direction: column; }
        .user-header { padding: 15px; background: #075e54; color: white; display: flex; justify-content: space-between; align-items: center; font-size: 15px; }
        .schedule-btn { background: #128c7e; color: white; border: none; padding: 8px 12px; border-radius: 5px; cursor: pointer; font-weight: bold; margin: 10px; }
        
        .users-list { flex: 1; overflow-y: auto; }
        .user-item { padding: 12px 15px; border-bottom: 1px solid #eee; cursor: pointer; display: flex; align-items: center; justify-content: space-between; }
        .user-item:hover, .user-item.active { background: #e9edef; }
        .online-dot { width: 10px; height: 10px; background: #25d366; border-radius: 50%; display: inline-block; }
        .offline-dot { width: 10px; height: 10px; background: #ccc; border-radius: 50%; display: inline-block; }

        .chat-area { width: 65%; display: flex; flex-direction: column; background: #efeae2; }
        .chat-header { padding: 12px 20px; background: #f0f2f5; border-bottom: 1px solid #ddd; display: flex; justify-content: space-between; align-items: center; }
        .chat-messages { flex: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; }
        
        .message-bubble { max-width: 65%; padding: 8px 12px; border-radius: 8px; font-size: 14px; position: relative; }
        .msg-mine { background: #d9fdd3; align-self: flex-end; }
        .msg-other { background: white; align-self: flex-start; }
        .message-bubble img { max-width: 250px; border-radius: 5px; margin-top: 5px; display: block; }

        .chat-input { padding: 10px; background: #f0f2f5; display: flex; gap: 10px; align-items: center; }
        .chat-input input[type="text"] { flex: 1; padding: 10px; border: 1px solid #ccc; border-radius: 20px; outline: none; }
        .chat-input button { padding: 10px 20px; border: none; border-radius: 20px; cursor: pointer; }
        #send-btn { background: #128c7e; color: white; }
        #attach-btn { background: transparent; font-size: 20px; padding: 5px 10px; cursor: pointer; color: #555; }

        .call-action-btns button { padding: 8px 12px; border: none; border-radius: 5px; cursor: pointer; font-size: 14px; margin-left: 5px; }
        .btn-audio { background: #007bff; color: white; }
        .btn-video { background: #28a745; color: white; }

        /* MODAL STYLING (Meeting Form & Meeting Room) */
        .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); justify-content: center; align-items: center; z-index: 2000; }
        .modal-card { background: white; width: 90%; max-width: 500px; padding: 25px; border-radius: 12px; box-shadow: 0 5px 20px rgba(0,0,0,0.3); }
        .modal-card h3 { margin-bottom: 15px; color: #075e54; }
        .modal-card label { display: block; font-size: 13px; font-weight: bold; margin-top: 10px; color: #333; }
        .modal-card input, .modal-card select, .modal-card textarea { width: 100%; padding: 9px; margin-top: 4px; border: 1px solid #ccc; border-radius: 5px; outline: none; }
        .modal-card textarea { height: 70px; resize: none; }
        .modal-btns { display: flex; justify-content: flex-end; gap: 10px; margin-top: 20px; }
        .btn-cancel { background: #888; color: white; border: none; padding: 8px 15px; border-radius: 5px; cursor: pointer; }
        .btn-submit { background: #075e54; color: white; border: none; padding: 8px 15px; border-radius: 5px; cursor: pointer; font-weight: bold; }

        /* PROFESSIONAL MULTI-USER MEETING ROOM */
        .meeting-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #1a1a1a; flex-direction: column; z-index: 3000; }
        .meeting-header { padding: 15px 25px; background: #252525; color: white; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #333; }
        .video-grid { flex: 1; padding: 20px; display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 15px; overflow-y: auto; justify-items: center; align-items: center; }
        .video-wrapper { position: relative; width: 100%; height: 230px; background: #000; border-radius: 10px; overflow: hidden; border: 2px solid #333; }
        .video-wrapper video { width: 100%; height: 100%; object-fit: cover; }
        .video-wrapper .user-label { position: absolute; bottom: 10px; left: 10px; background: rgba(0,0,0,0.6); color: white; padding: 4px 8px; border-radius: 4px; font-size: 12px; }

        .meeting-controls { padding: 15px; background: #252525; display: flex; justify-content: center; gap: 15px; border-top: 1px solid #333; }
        .ctrl-btn { width: 50px; height: 50px; border-radius: 50%; border: none; cursor: pointer; font-size: 18px; color: white; display: flex; justify-content: center; align-items: center; }
        .btn-mic-on { background: #333; }
        .btn-mic-off { background: #ea4335; }
        .btn-cam-on { background: #333; }
        .btn-cam-off { background: #ea4335; }
        .btn-leave { background: #ea4335; width: 60px; border-radius: 25px; font-size: 14px; font-weight: bold; }

        /* Incoming Call Notification */
        .call-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); color: white; justify-content: center; align-items: center; flex-direction: column; z-index: 1000; }
        .call-btns { display: flex; gap: 15px; margin-top: 20px; }
        .btn-call { padding: 12px 30px; border: none; border-radius: 30px; cursor: pointer; color: white; font-weight: bold; font-size: 16px; }
        .btn-accept { background-color: #25d366; }
        .btn-reject { background-color: #ea4335; }
    </style>
</head>
<body>

    <div id="auth-section">
        <h2>Chenabcall</h2>
        <p style="font-size: 12px; color: #666; margin-bottom: 15px;">Coworker Secure Portal</p>
        
        <input type="text" id="reg-name" placeholder="Aapka Naam (For Register)">
        <select id="reg-dept">
            <option value="">Select Department (For Register)</option>
            <option value="Management">Management</option>
            <option value="Machineshop">Machineshop</option>
            <option value="Foundry">Foundry</option>
            <option value="Gudam">Gudam</option>
            <option value="Finishing">Finishing</option>
        </select>
        
        <input type="email" id="email" placeholder="Email Address">
        <input type="password" id="password" placeholder="Password">
        
        <button id="login-btn" class="btn-login">Login</button>
        <button id="register-btn" class="btn-reg">New Register</button>
    </div>

    <div id="app-section">
        <div class="sidebar">
            <div class="user-header">
                <div id="my-name">User Profile</div>
                <button id="logout-btn" style="background: transparent; color: white; border: 1px solid white; padding: 4px 8px; border-radius: 4px; cursor: pointer;">Logout</button>
            </div>
            <button class="schedule-btn" id="open-schedule-modal">📅 Schedule Meeting & Send Email</button>
            <div class="users-list" id="users-list"></div>
        </div>

        <div class="chat-area">
            <div class="chat-header">
                <div><h4 id="target-user-name">Select a coworker</h4></div>
                <div class="call-action-btns" id="call-buttons" style="display: none;">
                    <button id="audio-call-btn" class="btn-audio">📞 Audio</button>
                    <button id="video-call-btn" class="btn-video">📹 Video</button>
                </div>
            </div>

            <div class="chat-messages" id="messages">
                <p style="text-align: center; color: #777;">Chat ya meeting shuru karein...</p>
            </div>

            <div class="chat-input" id="chat-input-area" style="display: none;">
                <input type="file" id="file-input" style="display: none;" accept="image/*, .pdf, .txt, .zip, .doc">
                <button id="attach-btn" title="Share File/Image">📎</button>
                
                <input type="text" id="msg-input" placeholder="Message likhein...">
                <button id="send-btn">Send</button>
            </div>
        </div>
    </div>

    <div class="modal-overlay" id="schedule-modal">
        <div class="modal-card">
            <h3>Schedule Coworker Meeting</h3>
            
            <label>Meeting Head / Host:</label>
            <select id="meeting-head-select"></select>

            <label>Select Participants (Coworkers):</label>
            <select id="meeting-members-select" multiple style="height: 80px;"></select>
            <small style="color:#666; font-size:11px;">Ctrl / Shift dabakar ek se zyada select karein</small>

            <label>Date & Time:</label>
            <input type="datetime-local" id="meeting-datetime">

            <label>Meeting Agenda (Maqsad):</label>
            <textarea id="meeting-agenda" placeholder="Meeting ka maqsad likhein..."></textarea>

            <div class="modal-btns">
                <button class="btn-cancel" id="close-schedule-modal">Cancel</button>
                <button class="btn-submit" id="send-meeting-invitation">Send Email Invite & Schedule</button>
            </div>
        </div>
    </div>

    <div class="call-overlay" id="call-modal">
        <h3 id="call-status-text">Calling...</h3>
        <div class="call-btns">
            <button id="accept-call-btn" class="btn-call btn-accept" style="display: none;">Accept</button>
            <button id="hangup-call-btn" class="btn-call btn-reject">End Call</button>
        </div>
    </div>

    <div class="meeting-overlay" id="meeting-room">
        <div class="meeting-header">
            <div>
                <h3 id="meeting-room-title">Conference Meeting</h3>
                <small id="meeting-room-agenda" style="color: #bbb;"></small>
            </div>
            <div id="meeting-head-badge" style="background: #075e54; padding: 5px 12px; border-radius: 15px; font-size: 12px;">Head: ---</div>
        </div>

        <div class="video-grid" id="video-grid">
            </div>

        <div class="meeting-controls">
            <button class="ctrl-btn btn-mic-on" id="toggle-mic-btn" title="Mute/Unmute Mic">🎙️</button>
            <button class="ctrl-btn btn-cam-on" id="toggle-cam-btn" title="Camera On/Off">📹</button>
            <button class="ctrl-btn btn-leave" id="leave-meeting-btn" title="Leave Meeting">Leave</button>
        </div>
    </div>

    <script type="module" src="app.js?v=6"></script>
</body>
</html>
