<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chenabcall - WhatsApp Style Chat & Call</title>
    <style>
        * { box-sizing: border-box; font-family: Arial, sans-serif; margin: 0; padding: 0; }
        body { background-color: #e5ddd5; display: flex; justify-content: center; align-items: center; height: 100vh; }
        
        /* Auth Screen */
        #auth-section { background: white; padding: 30px; border-radius: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); width: 320px; text-align: center; }
        #auth-section input { width: 100%; padding: 10px; margin: 8px 0; border: 1px solid #ccc; border-radius: 5px; }
        #auth-section button { width: 100%; padding: 10px; margin-top: 5px; border: none; border-radius: 5px; cursor: pointer; }
        .btn-login { background-color: #075e54; color: white; }
        .btn-reg { background-color: #128c7e; color: white; }

        /* Main App Container */
        #app-section { display: none; width: 90%; max-width: 1000px; height: 90vh; background: white; border-radius: 10px; box-shadow: 0 4px 15px rgba(0,0,0,0.2); overflow: hidden; }
        
        /* Sidebar */
        .sidebar { width: 30%; background: #f0f2f5; border-right: 1px solid #ddd; display: flex; flex-direction: column; }
        .user-header { padding: 15px; background: #075e54; color: white; display: flex; justify-content: space-between; align-items: center; }
        .users-list { flex: 1; overflow-y: auto; }
        .user-item { padding: 12px 15px; border-bottom: 1px solid #eee; cursor: pointer; display: flex; align-items: center; justify-content: space-between; }
        .user-item:hover, .user-item.active { background: #e9edef; }
        .online-dot { width: 10px; height: 10px; background: #25d366; border-radius: 50%; display: inline-block; }
        .offline-dot { width: 10px; height: 10px; background: #ccc; border-radius: 50%; display: inline-block; }

        /* Chat Area */
        .chat-area { width: 70%; display: flex; flex-direction: column; background: #efeae2; }
        .chat-header { padding: 12px 20px; background: #f0f2f5; border-bottom: 1px solid #ddd; display: flex; justify-content: space-between; align-items: center; }
        .chat-messages { flex: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; }
        .message-bubble { max-width: 60%; padding: 8px 12px; border-radius: 8px; font-size: 14px; }
        .msg-mine { background: #d9fdd3; align-self: flex-end; }
        .msg-other { background: white; align-self: flex-start; }
        .chat-input { padding: 10px; background: #f0f2f5; display: flex; gap: 10px; }
        .chat-input input { flex: 1; padding: 10px; border: 1px solid #ccc; border-radius: 20px; outline: none; }
        .chat-input button { padding: 10px 20px; background: #128c7e; color: white; border: none; border-radius: 20px; cursor: pointer; }

        /* Call Modal / Overlay */
        .call-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); color: white; justify-content: center; align-items: center; flex-direction: column; z-index: 1000; }
        .video-box { display: flex; gap: 20px; margin: 20px 0; }
        video { width: 300px; height: 225px; background: black; border-radius: 10px; }
        .call-btns { display: flex; gap: 15px; margin-top: 15px; }
        .btn-call { padding: 10px 20px; border: none; border-radius: 5px; cursor: pointer; color: white; font-weight: bold; }
        .btn-accept { background-color: #25d366; }
        .btn-reject { background-color: #ea4335; }

        .call-action-btns button { padding: 8px 12px; border: none; border-radius: 5px; cursor: pointer; font-size: 14px; margin-left: 5px; }
        .btn-audio { background: #007bff; color: white; }
        .btn-video { background: #28a745; color: white; }
    </style>
</head>
<body>

    <div id="auth-section">
        <h2>Chenabcall</h2>
        <p style="font-size: 12px; color: #666; margin-bottom: 15px;">Coworker Login / Register</p>
        <input type="email" id="email" placeholder="Email">
        <input type="password" id="password" placeholder="Password">
        <button id="login-btn" class="btn-login">Login</button>
        <button id="register-btn" class="btn-reg">Register</button>
    </div>

    <div id="app-section">
        <div class="sidebar">
            <div class="user-header">
                <div>
                    <strong id="my-name">User</strong>
                </div>
                <button id="logout-btn" style="background: transparent; color: white; border: 1px solid white; padding: 4px 8px; border-radius: 4px; cursor: pointer;">Logout</button>
            </div>
            <div class="users-list" id="users-list">
                </div>
        </div>

        <div class="chat-area">
            <div class="chat-header">
                <div>
                    <h4 id="target-user-name">Select a coworker to chat</h4>
                </div>
                <div class="call-action-btns" id="call-buttons" style="display: none;">
                    <button id="audio-call-btn" class="btn-audio">📞 Audio Call</button>
                    <button id="video-call-btn" class="btn-video">📹 Video Call</button>
                </div>
            </div>

            <div class="chat-messages" id="messages">
                <p style="text-align: center; color: #777;">Kanoon/Co-worker select karke baat shuru karein.</p>
            </div>

            <div class="chat-input" id="chat-input-area" style="display: none;">
                <input type="text" id="msg-input" placeholder="Message likhein...">
                <button id="send-btn">Send</button>
            </div>
        </div>
    </div>

    <div class="call-overlay" id="call-modal">
        <h3 id="call-status-text">Calling...</h3>
        <div class="video-box">
            <video id="local-video" autoplay playsinline muted></video>
            <video id="remote-video" autoplay playsinline></video>
        </div>
        <audio id="remote-audio" autoplay></audio>
        <div class="call-btns">
            <button id="accept-call-btn" class="btn-call btn-accept" style="display: none;">Accept</button>
            <button id="hangup-call-btn" class="btn-call btn-reject">End Call</button>
        </div>
    </div>

    <script type="module" src="app.js"></script>
</body>
</html>
